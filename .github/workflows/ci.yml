name: TastePilot checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATA_MODE: fixture
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m evaluation.run && python -m evaluation.group_run
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and smoke test deployment container
        run: |
          docker build -t tastepilot-ci .
          docker run -d --name tastepilot-ci -e DATA_MODE=fixture -e PORT=3100 -p 3100:3100 tastepilot-ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs tastepilot-ci; exit 1; fi
          curl -fsS http://127.0.0.1:3100/ > /dev/null
          docker stop tastepilot-ci
      - run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/tastepilot-backend.log 2>&1 &
          cd frontend
          npm run start > /tmp/tastepilot-frontend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 2
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            evaluation/results/
            frontend/test-results/
